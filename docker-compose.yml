version: "3.8"
services:
  db:
    image: docker.io/library/mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: buy_control
      MARIADB_USER: buy_control
      MARIADB_PASSWORD: "${DB_PASSWORD:-buy_control_local_only}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_local_only}"
    volumes:
      - db_data:/var/lib/mysql
  wordpress:
    image: docker.io/library/wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: buy_control
      WORDPRESS_DB_USER: buy_control
      WORDPRESS_DB_PASSWORD: "${DB_PASSWORD:-buy_control_local_only}"
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/buy-control-routemile-woocommerce:ro
volumes:
  db_data:
  wp_data:
